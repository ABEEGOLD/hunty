name: Bundle Size

on:
  pull_request:
    branches: [main, develop]

# Allow one concurrent deployment per branch, cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bundle Size & Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build Next.js application
        run: pnpm build

      - name: Check bundle size
        run: pnpm bundle:check
        working-directory: apps/web

      - name: Check performance budgets
        run: pnpm perf:budget
        working-directory: apps/web

      - name: Generate bundle report
        run: node scripts/generate-bundle-report.mjs
        working-directory: apps/web

      - name: Find previous comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Bundle Size Report"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: apps/web/bundle-report.md
          edit-mode: replace
